# Nginx — terminaison TLS de la SIGNALISATION LiveKit : wss://livekit.<domaine> → 127.0.0.1:7880
# À placer dans /etc/nginx/sites-available/livekit puis :
#   sudo ln -s /etc/nginx/sites-available/livekit /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d livekit.dualmusic.pro
#   sudo nginx -t && sudo systemctl reload nginx
# (Le MÉDIA ne passe pas par nginx : UDP 50000-50200, TCP 7881, TURN 3478/5349 directs.)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name livekit.dualmusic.pro;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Un WebSocket de signalisation reste ouvert pendant tout le direct.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
